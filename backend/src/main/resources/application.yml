spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/gamenews;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
    include-stacktrace: never
auth:
  jwt-secret: ${JWT_SECRET}
  issuer: game-news-api
  audience: game-news-web
  ttl-seconds: 1800
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
ingestion:
  steam:
    enabled: ${STEAM_INGESTION_ENABLED:true}
    scheduling-enabled: ${STEAM_SCHEDULING_ENABLED:true}
    count: ${STEAM_NEWS_COUNT:20}
    timeout-ms: 10000
    max-retries: 2
    interval-ms: 1800000
    initial-delay-ms: 10000
